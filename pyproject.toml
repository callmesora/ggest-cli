[project]
name = "ggest-cli"
version = "3.0.0"
description = "Read-only business intelligence toolkit for gGest (Golfinho Software) ERP databases: CLI, MCP server and agent skills"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "fastmcp>=4.1,<5",
]

[project.scripts]
ggest = "bi.cli:main"
ggest-mcp = "bi.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "radon>=6",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bi", "pipeline"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", "dashboards/page", "dashboards/store", "dashboards/datasets"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "C90", "SIM", "PTH", "RUF", "PL", "PIE", "RET", "TRY", "PERF",
    "S", "DTZ", "BLE", "ARG", "ISC", "PT", "Q",
]
ignore = [
    "S608",     # SQL is built from whitelisted identifiers only; values always go through parameters
    "PLR0913",  # tool functions mirror their CLI/MCP parameters
    "TRY003",   # short error messages inline are fine
    "S603", "S607",  # subprocess calls run our own PowerShell/WDMap with fixed arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG001"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 12
max-returns = 6

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["livedb: needs the real data/data.sqlite (skipped when absent)"]

[tool.coverage.run]
source = ["bi", "pipeline", "dashboards"]
omit = ["pipeline/hidden_*"]
